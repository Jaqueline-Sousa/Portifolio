<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Área de Cadastro | Jaqueline</title>
</head>

<body>

    <main>
        
        <div class="cadastro-container">
            <form action="" class="area-formulario">
                

        <!-- Container centralizado no meio da tela -->
        <div class="cadastro-container">
            <form action="" class="area-formulario">
                <div class="area-titulo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <h1>Crie sua Conta</h1>
                    <span>Preencha os dados para acessar o portfólio</span>
                </div>

                <!-- Campo Nome -->
                <div class="area-input">
                    <label for="nome">Nome Completo</label>
                    <div class="input-com-icone">
                        <i class="fa-regular fa-user icone-esquerda"></i>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>
                </div>

                <!-- Campo Email -->
                <div class="area-input">
                    <label for="email">Email</label>
                    <div class="input-com-icone">
                        <i class="fa-regular fa-envelope icone-esquerda"></i>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="area-input">
                    <label for="senha">Senha</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-lock icone-esquerda"></i>
                        <input type="password" id="senha" placeholder="Crie uma senha" required>
                        <i class="fa-regular fa-eye icone-direita toggle-senha" data-target="senha" title="Mostrar/Ocultar senha"></i>
                    </div>
                </div>

                <!-- Campo Confirmar Senha -->
                <div class="area-input">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-shield-halved icone-esquerda"></i>
                        <input type="password" id="confirmar-senha" placeholder="Repita sua senha" required>
                        <i class="fa-regular fa-eye icone-direita toggle-senha" data-target="confirmar-senha" title="Mostrar/Ocultar senha"></i>
                    </div>
                </div>

                <!-- Termos de uso -->
                <div class="lembrar-senha">
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="termos" required>
                        <label for="termos">Concordo com os termos de acesso</label>
                    </div>
                </div>

                <!-- Botão Cadastrar e Link para voltar ao Login -->
                <div class="area-botao">
                    <button type="button" id="btn-cadastrar">Cadastrar</button>
                    <a href="login.html" class="link-cadastro">Já possui uma conta? <strong>Faça Login</strong></a>
                </div>
            </form>
        </div>
    </main>

    <!-- Script para mostrar/ocultar senhas e redirecionar -->
    <script>
        // Mostrar / Ocultar ambos os campos de senha
        const botoesOlho = document.querySelectorAll('.toggle-senha');
        botoesOlho.forEach(botao => {
            botao.addEventListener('click', () => {
                const inputAlvo = document.getElementById(botao.getAttribute('data-target'));
                const isPassword = inputAlvo.type === 'password';
                inputAlvo.type = isPassword ? 'text' : 'password';

                botao.classList.toggle('fa-eye');
                botao.classList.toggle('fa-eye-slash');
            });
        });

        // Validação simples e redirecionamento ao cadastrar
        const btnCadastrar = document.getElementById('btn-cadastrar');
        btnCadastrar.addEventListener('click', () => {
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;

            if (senha !== confirmar) {
                alert('As senhas não coincidem! Verifique e tente novamente.');
                return;
            }

            // Redireciona para o login após cadastrar (ou direto para portifolio.html se preferir)
            alert('Cadastro realizado com sucesso!');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
